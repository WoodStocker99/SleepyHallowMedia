<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.ico">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sleepy Hollow Media — Article</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="article">

  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" role="banner">
    <div class="wrap header-row">
      <a class="brand" href="index.html">
        <img class="brand-mark" src="assets/logo.png" alt="" />
        <span class="brand-name">Sleepy Hollow Media</span>
      </a>
      <nav class="primary-nav" aria-label="Primary">
        <a href="index.html" data-nav="home">Home</a>
        <a href="newsletters.html" data-nav="newsletters">Newsletters</a>
        <a href="newsletters.html?category=Politics">Politics</a>
        <a href="newsletters.html?category=Culture">Culture</a>
        <a href="newsletters.html?category=Opinion">Opinion</a>
      </nav>
      <button class="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="mobile-menu">☰</button>
    </div>
    <nav id="mobile-menu" class="mobile-menu" aria-label="Mobile">
      <a href="index.html" data-nav="home">Home</a>
      <a href="newsletters.html" data-nav="newsletters">Newsletters</a>
      <a href="newsletters.html?category=Politics">Politics</a>
      <a href="newsletters.html?category=Culture">Culture</a>
      <a href="newsletters.html?category=Opinion">Opinion</a>
    </nav>
  </header>

  <!-- Article hero -->
  <section id="article-hero" class="a-hero" aria-label="Article header">
    <div class="a-hero-bg" aria-hidden="true"></div>
    <div class="wrap a-hero-inner">
      <div id="article-category" class="a-kicker" hidden></div>
      <h1 id="article-title" class="a-title"></h1>
      <p id="article-subtitle" class="a-sub"></p>
      <div class="a-byline">
        <span id="article-meta"></span>
        <span id="article-reading-time" class="reading-time"></span>
      </div>
    </div>
  </section>

  <main class="wrap article-wrap" id="main" tabindex="-1">
    <article id="article-content" class="article-body"></article>

    <aside class="share-bar" aria-label="Share this article">
      <button class="share-btn" data-share="copy">Copy Link</button>
      <a class="share-btn" data-share="email" target="_blank" rel="noopener">Email</a>
      <a class="share-btn" data-share="reddit" target="_blank" rel="noopener">Reddit</a>
      <a class="share-btn" data-share="x" target="_blank" rel="noopener">X</a>
      <span id="share-feedback" class="share-feedback" role="status" aria-live="polite"></span>
    </aside>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-grid">
      <div class="copy muted">© <span id="year"></span> Sleepy Hollow Media</div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js" crossorigin="anonymous"></script>
  <script src="script.js"></script>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
