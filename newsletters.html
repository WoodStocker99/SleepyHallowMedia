<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sleepy Hallow Media — All Newsletters</title>

  <link rel="icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css?v=4.6" />

  <!-- Markdown + Sanitizer -->
  <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>

  <script defer src="script.js?v=4.6"></script>
</head>
<body data-page="list">
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Topbar (same search everywhere) -->
  <div class="topbar" aria-label="Site tools">
    <div class="wrap topbar-row">
      <div class="topbar-left">
        <a class="top-link" href="newsletters.html">Latest</a>
        <a class="top-link" href="newsletters.html?tag=Local">Local</a>
        <a class="top-link" href="newsletters.html?tag=Opinion">Opinion</a>
      </div>

      <form id="site-search" class="top-search" action="newsletters.html" method="get" role="search">
        <label for="q" class="sr-only">Search</label>
        <input id="q" name="q" type="search" placeholder="Search…" autocomplete="off" />
        <button class="btn" type="submit" aria-label="Search">Search</button>
      </form>
    </div>
  </div>

  <header class="site-header" role="banner">
    <div class="wrap header-row">
      <a class="brand" href="index.html" data-nav="home">
        <img class="brand-mark" src="assets/logo.png" alt="" />
        <span class="brand-name">Sleepy Hallow Media</span>
      </a>
      <nav class="primary-nav" aria-label="Primary">
        <a href="index.html" data-nav="home">Home</a>
        <a href="newsletters.html" data-nav="newsletters">Newsletters</a>
      </nav>
      <div class="header-tools">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
          <span class="theme-icon" aria-hidden="true">🌙</span>
        </button>
        <button class="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="mobile-menu">☰</button>
      </div>
    </div>
    <nav id="mobile-menu" class="mobile-menu" aria-label="Mobile">
      <a href="index.html">Home</a>
      <a href="newsletters.html">Newsletters</a>
    </nav>
  </header>

  <main class="wrap list-page" id="main" tabindex="-1">
    <h1 class="page-title">All Newsletters</h1>

    <!-- Filters / Search summary -->
    <div class="filter-row" role="region" aria-label="Filters">
      <div id="active-filter" class="muted"></div>

      <div class="muted" style="margin-top:.6rem">Categories</div>
      <div id="category-chips" class="trend-tags" style="margin-top:.2rem;"></div>

      <div class="muted" style="margin-top:.6rem">Tags</div>
      <div id="tag-cloud" class="trend-tags" style="margin-top:.2rem;"></div>
    </div>

    <div id="news-list" class="cards-grid"><!-- JS --></div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-grid">
      <div class="copy muted">© <span id="year"></span> Sleepy Hallow Media</div>
    </div>
  </footer>

  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
